name: Vidro Launcher APK

on:
  push:
    branches:
      - vidro
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build APK
        run: ./gradlew assembleLawnWithQuickstepGithubDebug
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: VidroLauncher-APK
          path: build/outputs/apk/**/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find build/outputs/apk -name '*.apk' | head -1)
          cp "$APK" VidroLauncher.apk
          TAG="vidro-${{ github.run_number }}"
          gh release create "$TAG" VidroLauncher.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Vidro Launcher (teste ${{ github.run_number }})" \
            --notes "APK de teste do Vidro Launcher. Baixe o arquivo VidroLauncher.apk abaixo." \
            --latest
